<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לידאס — מערכת ניהול סוכנות</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c8a45a'/><text y='72' x='50' text-anchor='middle' font-size='60' fill='%230d1821' font-family='serif' font-weight='bold'>ל</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1520;--bg2:#111e2e;--bg3:#172438;--bg4:#1c2d44;
  --gold:#c8a45a;--gold2:#e4c47c;--gold3:#f5d898;
  --gdim:rgba(200,164,90,0.10);--gdim2:rgba(200,164,90,0.05);
  --green:#3ecf8e;--green2:rgba(62,207,142,0.12);
  --red:#f56565;--red2:rgba(245,101,101,0.12);
  --blue:#63b3ed;--blue2:rgba(99,179,237,0.12);
  --amber:#f6ad55;--amber2:rgba(246,173,85,0.12);
  --text:#eae6df;--t2:#a8b8c8;--t3:#5a7090;
  --bdr:rgba(200,164,90,0.15);--bdr2:rgba(255,255,255,0.05);
  --sidebar:220px;--topbar:58px;--r:10px;--rl:14px;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;display:flex}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 5% 5%,rgba(200,164,90,0.04) 0%,transparent 55%),
             radial-gradient(ellipse 50% 60% at 95% 95%,rgba(99,179,237,0.03) 0%,transparent 55%)}

/* ── LOGIN SCREEN ── */
.login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;transition:opacity .5s}
.login-screen.gone{opacity:0;pointer-events:none}
.login-bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 60% at 20% 20%,rgba(200,164,90,0.06) 0%,transparent 55%),
  radial-gradient(ellipse 60% 60% at 80% 80%,rgba(99,179,237,0.04) 0%,transparent 55%);
  pointer-events:none}
.login-box{position:relative;background:var(--bg3);border:1px solid var(--bdr);border-radius:20px;padding:44px 40px 36px;width:400px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:popIn .5s cubic-bezier(.34,1.3,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:none}}
.login-logo{width:60px;height:60px;border-radius:16px;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--bg);margin-bottom:20px;font-family:serif;box-shadow:0 8px 24px rgba(200,164,90,0.3)}
.login-title{font-size:24px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--t3);margin-bottom:32px}
.login-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);display:block;text-align:right;margin-bottom:6px}
.login-input-wrap{position:relative;margin-bottom:20px}
.login-input{width:100%;padding:12px 44px 12px 14px;font-size:15px;font-family:'Heebo',sans-serif;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:10px;color:var(--text);text-align:center;letter-spacing:.1em;transition:border .2s,box-shadow .2s}
.login-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,90,0.12)}
.eye-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;transition:color .2s}
.eye-btn:hover{color:var(--text)}
.login-btn{width:100%;padding:13px;font-size:15px;font-weight:700;font-family:'Heebo',sans-serif;background:var(--gold);color:var(--bg);border:none;border-radius:10px;cursor:pointer;transition:all .2s;margin-top:4px}
.login-btn:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,164,90,0.3)}
.login-btn:active{transform:none}
.login-btn:disabled{opacity:.6;transform:none;cursor:wait}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:18px;transition:opacity .2s}
.login-footer{margin-top:20px;font-size:11px;color:var(--t3)}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.loading-dots{display:inline-flex;gap:5px;align-items:center;justify-content:center}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--bg);animation:dot .8s infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);height:100vh;background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;position:fixed;right:0;top:0;z-index:100;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar.closed{transform:translateX(100%)}
.sbrand{padding:18px 16px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr)}
.sbrand-logo{width:34px;height:34px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--bg);font-family:serif;flex-shrink:0}
.sbrand-name{font-size:14px;font-weight:700;line-height:1.2}
.sbrand-sub{font-size:10px;color:var(--t3);margin-top:1px}
.snav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
.snav-lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding:8px 8px 4px}
.snav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--t2);cursor:pointer;transition:all .15s;border-right:2px solid transparent;margin-bottom:1px;user-select:none}
.snav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.6;transition:opacity .15s}
.snav-item:hover{background:var(--gdim2);color:var(--text)}
.snav-item.active{background:var(--gdim);color:var(--gold);border-right-color:var(--gold)}
.snav-item.active svg{opacity:1}
.sfooter{padding:10px 8px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:6px}
.btn-refresh{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 10px;border-radius:8px;font-size:12px;font-family:'Heebo',sans-serif;font-weight:600;background:var(--gdim);color:var(--gold);border:1px solid var(--bdr);cursor:pointer;transition:all .15s}
.btn-refresh:hover{background:rgba(200,164,90,.18)}
.btn-logout{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px 10px;border-radius:8px;font-size:11px;font-family:'Heebo',sans-serif;color:var(--t3);background:transparent;border:1px solid var(--bdr2);cursor:pointer;transition:all .15s}
.btn-logout:hover{color:var(--red);border-color:rgba(245,101,101,.3)}

/* ── MAIN ── */
.main{flex:1;margin-right:var(--sidebar);height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;transition:margin .3s}
.main.full{margin-right:0}
.topbar{height:var(--topbar);background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;gap:12px}
.tb-left{display:flex;align-items:center;gap:12px}
.hamburger{background:none;border:none;color:var(--t2);cursor:pointer;padding:6px;border-radius:7px;display:flex;transition:color .15s}
.hamburger:hover{color:var(--text);background:var(--gdim2)}
.page-title{font-size:16px;font-weight:600}
.tb-right{display:flex;align-items:center;gap:10px}
.conn-status{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);transition:background .3s}
.conn-dot.live{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn-report{padding:7px 16px;font-size:12px;font-weight:700;font-family:'Heebo',sans-serif;background:var(--gold);color:var(--bg);border:none;border-radius:100px;cursor:pointer;transition:all .2s}
.btn-report:hover{background:var(--gold2);box-shadow:0 4px 16px rgba(200,164,90,.3)}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:22px;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
.page-wrap{animation:pageIn .3s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px 16px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.3);border-color:rgba(200,164,90,.3)}
.kpi::after{content:'';position:absolute;top:0;right:0;width:72px;height:72px;border-radius:0 var(--rl) 0 72px;background:var(--gdim2)}
.kpi-lbl{font-size:11px;color:var(--t3);margin-bottom:7px}
.kpi-val{font-size:26px;font-weight:700;line-height:1;margin-bottom:5px}
.kv-gold{color:var(--gold)}.kv-green{color:var(--green)}.kv-red{color:var(--red)}.kv-blue{color:var(--blue)}
.kpi-sub{font-size:11px;color:var(--t3)}
.kpi-sub.up{color:var(--green)}.kpi-sub.dn{color:var(--red)}

/* ── CARD ── */
.sec{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--bdr)}
.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;margin-bottom:20px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:600}
.chip{font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--gdim);color:var(--gold);border:1px solid var(--bdr);white-space:nowrap}
.chip.g{background:var(--green2);color:var(--green);border-color:rgba(62,207,142,.2)}
.chip.r{background:var(--red2);color:var(--red);border-color:rgba(245,101,101,.2)}
.chip.b{background:var(--blue2);color:var(--blue);border-color:rgba(99,179,237,.2)}

/* ── TABLE ── */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:9px 14px;text-align:right;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--bdr);background:rgba(10,21,32,.5);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid rgba(200,164,90,.05);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(200,164,90,.04)}
.tn{font-weight:500;color:var(--text);white-space:nowrap}
.ta{font-weight:600;color:var(--gold);white-space:nowrap}
.tm{color:var(--t3);font-size:11px;white-space:nowrap}

/* ── BADGE ── */
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;white-space:nowrap}
.bg{background:var(--green2);color:var(--green)}
.br{background:var(--red2);color:var(--red)}
.bo{background:var(--gdim);color:var(--gold)}
.bb{background:var(--blue2);color:var(--blue)}
.bx{background:rgba(90,112,144,.15);color:var(--t3)}
.bam{background:var(--amber2);color:var(--amber)}

/* ── MISC ── */
.prog-w{display:flex;align-items:center;gap:8px}
.prog{flex:1;min-width:50px;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width .6s ease}
.pfg{background:var(--green)}.pfr{background:var(--red)}.pfo{background:var(--gold)}
.pp{font-size:11px;color:var(--t3);min-width:32px;text-align:left}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:20px}
.bchart{padding:14px 18px 12px;display:flex;align-items:flex-end;gap:12px;height:160px}
.bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bc-v{font-size:10px;font-weight:600;color:var(--gold2)}
.bc-bar{width:100%;border-radius:4px 4px 0 0;transition:height .7s cubic-bezier(.34,1.2,.64,1)}
.bc-l{font-size:10px;color:var(--t3)}
.wcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.wcard{background:var(--bg2);border:1px solid var(--bdr2);border-radius:var(--r);padding:14px;transition:border-color .2s}
.wcard:hover{border-color:var(--bdr)}
.wav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:9px}
.wn{font-size:13px;font-weight:600;margin-bottom:2px}
.wr{font-size:10px;color:var(--t3);margin-bottom:9px}
.ws{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.ws span:first-child{color:var(--t3)}
.insights{background:var(--gdim);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px 22px;margin-bottom:20px}
.insights h3{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:10px}
.insights p{font-size:13px;line-height:1.8;color:var(--t2)}
.insights p strong{color:var(--text)}
.report-hero{margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-start}
.rh-l h1{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.rh-l h2{font-size:30px;font-weight:700;line-height:1.1}
.rh-l h2 span{color:var(--gold)}
.rh-l p{font-size:12px;color:var(--t3);margin-top:6px}
.pbtn{display:inline-flex;align-items:center;gap:6px;background:var(--gdim);border:1px solid var(--bdr);border-radius:100px;padding:8px 16px;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;font-family:'Heebo',sans-serif;transition:background .2s}
.pbtn:hover{background:rgba(200,164,90,.2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg3);border:1px solid var(--bdr);border-radius:100px;padding:10px 20px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.4);opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(62,207,142,.3);color:var(--green)}
.toast.err{border-color:rgba(245,101,101,.3);color:var(--red)}
.empty{text-align:center;padding:36px;color:var(--t3);font-size:13px}
.empty strong{display:block;font-size:15px;color:var(--t2);margin-bottom:6px}
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fbar input,.fbar select{padding:6px 11px;font-size:12px;font-family:'Heebo',sans-serif;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--text);transition:border .2s}
.fbar input:focus,.fbar select:focus{outline:none;border-color:var(--gold)}
.fbar select option{background:var(--bg2)}
.stat-chip{display:inline-flex;align-items:center;background:var(--bg3);border:1px solid var(--bdr2);border-radius:100px;padding:4px 10px;font-size:11px;color:var(--t3);white-space:nowrap}
.loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,21,32,.85);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.loading-overlay.show{opacity:1;pointer-events:auto}
.loading-spinner{width:40px;height:40px;border:3px solid var(--bdr);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:13px;color:var(--t2)}
@media(max-width:960px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.wcards{grid-template-columns:repeat(2,1fr)}}
@media print{.sidebar,.topbar,.fbar,.pbtn,.btn-logout,.btn-refresh{display:none!important}.main{margin-right:0!important}body{background:#fff;color:#111;overflow:visible}.content{overflow:visible}:root{--bg:#fff;--bg2:#f8f7f5;--bg3:#f3f2f0;--text:#111;--t2:#444;--t3:#777;--bdr:#ddd;--bdr2:#eee;--gold:#8a620e;--green:#1a6040;--red:#8b2020}}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen">
  <div class="login-bg"></div>
  <div class="login-box">
    <div class="login-logo">ל</div>
    <div class="login-title">לידאס</div>
    <div class="login-sub">מערכת ניהול פנימית — הנהלה בלבד</div>
    <label class="login-label">סיסמה</label>
    <div class="login-input-wrap">
      <input id="pass-input" class="login-input" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="eye-btn" onclick="toggleEye()" id="eye-btn">
        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">כניסה למערכת</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-footer">לידאס סוכנות דיגיטל · גישה מורשית בלבד</div>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-msg" id="loading-msg">שואב נתונים מאירטייבל...</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar closed" id="sidebar">
  <div class="sbrand">
    <div class="sbrand-logo">ל</div>
    <div>
      <div class="sbrand-name">לידאס</div>
      <div class="sbrand-sub" id="conn-lbl">מחובר</div>
    </div>
  </div>
  <div class="snav">
    <div class="snav-lbl">ראשי</div>
    <div class="snav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>דשבורד
    </div>
    <div class="snav-item" data-page="retainers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>רטיינרים
    </div>
    <div class="snav-item" data-page="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>לקוחות
    </div>
    <div class="snav-item" data-page="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>פרויקטים
    </div>
    <div class="snav-lbl" style="margin-top:14px">כספים</div>
    <div class="snav-item" data-page="revenue">

// ── AIRTABLE ──
async function atFetch(tableId, fields=[]){
  let all=[],offset=null;
  do{
    const p=new URLSearchParams({table:tableId,pageSize:100});
    fields.forEach(f=>p.append('fields[]',f));
    if(offset) p.set('offset',offset);
    const r=await fetch(`/api/airtable?${p}`);
    if(!r.ok) return null;
    const d=await r.json();
    all=[...all,...(d.records||[])];
    offset=d.offset||null;
  } while(offset);
  return all;
}

    status:(fld(r,'fldr3uehCN59rrWMC')||{}).name||'פעיל',

    gr:parseFloat(fld(r,'fldAdD1LBYzg1VXwB'))||0,
    total:parseFloat(fld(r,'fldpnGPCU4W9dXny9'))||0,

}

  const q=(document.getElementById('rs')?.value||'').toLowerCase();

  const chip=document.getElementById('rct'); if(chip) chip.textContent=`${rows.length} רשומות · ${fmt(rows.filter(isActive).reduce((s,r)=>s+retTotal(r),0))}`;
};
